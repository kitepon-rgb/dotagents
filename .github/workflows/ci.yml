name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # shellcheck / node は ubuntu-latest ランナー同梱。欠けたら version 表示で
      # fail-loud（黙って skip しない）。Codex は clean HOME test の完全 TOML parser として固定導入する。
      - name: tool versions
        run: |
          shellcheck --version
          node --version
      - name: install Codex CLI
        run: |
          npm view @openai/codex@0.144.1 version
          npm install --global @openai/codex@0.144.1
          codex --version
      - name: make ci (local/CI common gate)
        run: make ci
