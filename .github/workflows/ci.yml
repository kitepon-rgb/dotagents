name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # install.sh と bin/ 配下の全スクリプトの構文検査（ローカルで green 確認済みの同一コマンド）
      - name: bash syntax check
        run: |
          set -euo pipefail
          bash -n install.sh
          for f in bin/*.sh; do bash -n "$f"; done
