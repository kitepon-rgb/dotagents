name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # shellcheck / node は ubuntu-latest ランナー同梱。欠けたら version 表示で
      # fail-loud（黙って skip しない）。ローカルは `make lint`（正典 docs/04_ci.md）。
      - name: tool versions
        run: |
          shellcheck --version
          node --version
      - name: make lint (shellcheck + markdownlint)
        run: make lint
